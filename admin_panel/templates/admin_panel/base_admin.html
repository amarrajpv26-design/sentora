{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scentora | Luxury Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0f0e0c; color: #e0d5c0; font-family: 'Inter', sans-serif; }
        .sidebar { width: 240px; background: #1a1814; height: 100vh; position: fixed; border-right: 1px solid #2d2a24; }
        .nav-link { color: #8c867a; padding: 12px 25px; display: block; text-decoration: none; transition: 0.3s; }
        .nav-link.active, .nav-link:hover { background: #26231d; color: #d4af37; border-left: 4px solid #d4af37; }
        .main-content { margin-left: 240px; padding: 20px; }
        .header { background: #1a1814; padding: 15px 30px; border-bottom: 1px solid #2d2a24; }
        .scentora-gold { color: #d4af37; }
        .card-custom { background: #1a1814; border: 1px solid #2d2a24; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="p-4"><h4 class="scentora-gold fw-bold">Scentora</h4><small class="text-uppercase" style="font-size: 10px;">Luxury Admin</small></div>
        <nav class="mt-3">
            <a href="{% url 'admin_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}"><i class="bi bi-grid-fill me-2"></i> Dashboard</a>
            <a href="{% url 'user_management' %}" class="nav-link {% if request.resolver_match.url_name == 'user_management' %}active{% endif %}"><i class="bi bi-people-fill me-2"></i> Users</a>
            <a href="#" class="nav-link"><i class="bi bi-box-seam me-2"></i> Products</a>
            </nav>
    </div>

    <div class="main-content">
        <div class="header d-flex justify-content-between align-items-center mb-4 card-custom">
            <div class="search-bar w-50">
                <form action="{% url 'user_management' %}" method="GET">
                    <input type="text" name="search" class="form-control bg-dark border-secondary text-white" placeholder="Search by name, email or ID...">
                </form>
            </div>
            <div class="user-profile d-flex align-items-center">
                <div class="text-end me-3"><p class="mb-0 small fw-bold">Alex Thompson</p><small class="text-muted">Super Admin</small></div>
                <img src="https://via.placeholder.com/40" class="rounded-circle border border-warning" alt="Admin">
            </div>
        </div>

        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
