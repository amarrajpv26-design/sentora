<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scentora Admin | Executive Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#f4b41a',
                        obsidian: '#030303',
                        rich: '#0a0a0a',
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .luxury-shimmer {
                background: linear-gradient(90deg, #f4b41a, #fff, #f4b41a);
                background-size: 200% auto;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: shimmer 4s linear infinite;
            }
            @keyframes shimmer { to { background-position: 200% center; } }

            .glass-card {
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
                backdrop-filter: blur(25px);
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.9);
            }

            /* FIXED ALIGNMENT CLASSES */
            .input-wrapper {
                @apply relative flex items-center w-full;
            }

            .input-field {
                @apply w-full bg-white/[0.02] border border-white/5 rounded-2xl px-12 py-4 text-sm text-white outline-none transition-all duration-300 focus:border-gold/30 focus:bg-white/[0.04] placeholder:text-white/10;
            }

            .inner-icon-left {
                @apply absolute left-4 text-white/20 transition-colors duration-300 pointer-events-none text-lg;
            }

            .inner-icon-right {
                @apply absolute right-4 text-white/20 hover:text-gold transition-colors duration-300 text-lg flex items-center justify-center;
            }
        }
    </style>
</head>
<body class="bg-[#020202] font-sans min-h-screen flex items-center justify-center p-6 overflow-hidden">

    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-gold/5 blur-[140px] rounded-full"></div>
    </div>

    <div class="relative z-10 w-full max-w-[440px] animate__animated animate__fadeIn">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black tracking-[-1px] text-white uppercase italic">
                SCENTORA <span class="luxury-shimmer not-italic">ADMIN</span>
            </h1>
            <p class="text-[9px] text-white/30 uppercase tracking-[5px] mt-2 font-bold">Executive Dashboard</p>
        </div>

        <div class="glass-card rounded-[45px] p-10 md:p-12 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-gold/30 to-transparent"></div>

            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for message in messages %}
                        <div class="p-4 rounded-2xl text-[10px] font-black uppercase tracking-[1px] flex items-center gap-3 animate__animated animate__shakeX
                            {% if message.tags == 'error' %} 
                                background: rgba(255, 0, 0, 0.05); color: #ff4d4d; border: 1px solid rgba(255, 0, 0, 0.1);
                            {% else %} 
                                background: rgba(244, 180, 26, 0.05); color: #f4b41a; border: 1px solid rgba(244, 180, 26, 0.1);
                            {% endif %}">
                            <i class="bi bi-exclamation-octagon-fill"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <div class="mb-10">
                <h2 class="text-2xl font-bold text-white tracking-tight">System Login</h2>
                <p class="text-white/20 text-xs mt-1">Enter authorized credentials to proceed.</p>
            </div>

            <form method="POST" action="{% url 'admin_login' %}" class="space-y-7">
                {% csrf_token %}
                
                <div>
                    <label class="text-[10px] font-black uppercase tracking-[2px] text-gold block mb-3 ml-1">Identity (Email)</label>
                    <div class="input-wrapper group">
                        <i class="bi bi-envelope inner-icon-left group-focus-within:text-gold"></i>
                        <input type="email" name="email" placeholder="admin@scentora.com" required 
                               class="input-field">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase tracking-[2px] text-gold block mb-3 ml-1">Access Key</label>
                    <div class="input-wrapper group">
                        <i class="bi bi-lock inner-icon-left group-focus-within:text-gold"></i>
                        <input type="password" name="password" id="passwordInput" placeholder="••••••••" required 
                               class="input-field">
                        <button type="button" id="togglePassword" class="inner-icon-right">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full py-5 bg-gold text-black font-black text-[12px] uppercase tracking-[3px] rounded-[20px] hover:shadow-[0_15px_40px_rgba(244,180,26,0.3)] transition-all active:scale-[0.98] flex items-center justify-center gap-3 mt-4">
                    Authenticate <i class="bi bi-arrow-right text-lg"></i>
                </button>
            </form>
        </div>

        <p class="text-center mt-10 text-[9px] text-white/10 uppercase tracking-[4px] font-bold">
            Authorized Personnel Only
        </p>
    </div>

    <script>
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');

        toggleBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            const icon = this.querySelector('i');
            icon.classList.toggle('bi-eye');
            icon.classList.toggle('bi-eye-slash');
        });
    </script>
</body>
</html>
