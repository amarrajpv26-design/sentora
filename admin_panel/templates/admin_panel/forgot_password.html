<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sentora Admin | Recover Access</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
              rel="stylesheet">
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <style>
        :root {
            --bg-dark: #12100a; 
            --card-bg: #1c1912;
            --input-bg: #15130d;
            --sentora-gold: #f4b41a; 
            --text-muted: #8a857a;
            --border-color: #2a271f;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1e1b12 0%, var(--bg-dark) 100%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
            margin: 0;
        }

        .login-container { width: 100%; max-width: 450px; text-align: center; }

        .brand-title {
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 1.8rem;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        .brand-title span { color: var(--sentora-gold); }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            text-align: left;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .auth-card h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; }
        .auth-card p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 30px; }

        .field-label {
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 10px;
            display: block;
            color: #e0ddd5;
        }

        .input-well {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .input-well i { color: var(--text-muted); margin-right: 12px; }
        .input-well input {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            outline: none;
            font-size: 0.95rem;
        }

        .btn-login {
            background: var(--sentora-gold);
            color: #000;
            border: none;
            border-radius: 8px;
            width: 100%;
            padding: 14px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex; align-items: center; justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-login:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .back-to-login {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .back-to-login:hover { color: var(--sentora-gold); }
        </style>
    </head>
    <body>
        <div class="login-container">
            <div class="brand-title">
                SCENTORA <span>ADMIN</span>
            </div>
            <div class="auth-card">
                <h2>Recover Access</h2>
                <p>Enter your email and we'll send you a link to reset your password.</p>
                <form method="POST">
                    {% csrf_token %}
                    <label class="field-label">Email Address</label>
                    <div class="input-well">
                        <i class="bi bi-envelope"></i>
                        <input type="email" name="email" placeholder="admin@scentora.com" required>
                    </div>
                    <button type="submit" class="btn-login">
                        SEND RECOVERY LINK <i class="bi bi-send"></i>
                    </button>
                </form>
                <a href="{% url 'admin_login' %}" class="back-to-login">
                    <i class="bi bi-arrow-left"></i> Return to Login
                </a>
            </div>
        </div>
    </body>
</html>
