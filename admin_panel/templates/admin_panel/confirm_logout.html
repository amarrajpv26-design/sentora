<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scentora | Confirm Sign Out</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
        }
        .gold-border {
            border-color: rgba(212, 175, 55, 0.2);
        }
        .text-gold {
            color: #D4AF37;
        }
        .bg-gold {
            background-color: #D4AF37;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md px-6">
        <div class="text-center mb-8">
            <h1 class="text-gold text-3xl font-bold tracking-[0.2em] uppercase">Scentora</h1>
            <p class="text-white/40 text-[10px] uppercase tracking-[0.3em] mt-2">Administrative Portal</p>
        </div>

        <div class="bg-[#0a0a0a] border gold-border p-10 rounded-2xl shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-gold/5 blur-[80px] rounded-full"></div>
            
            <div class="relative z-10 text-center">
                <div class="w-20 h-20 bg-gold/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-gold/20">
                    <i class="bi bi-door-open text-gold text-3xl"></i>
                </div>

                <h2 class="text-white text-2xl font-semibold mb-3">Ready to leave?</h2>
                <p class="text-gray-500 text-sm mb-10 leading-relaxed">
                    Ending your session will require you to sign back in to manage your inventory and users.
                </p>

                <form method="POST" action="{% url 'admin_logout' %}" class="space-y-4">
                    {% csrf_token %}
                    
                    <button type="submit" 
                            class="w-full py-4 bg-gold text-black font-bold text-xs uppercase tracking-[0.2em] rounded-lg hover:bg-white transition-all duration-300 transform hover:-translate-y-1">
                        Confirm Sign Out
                    </button>

                    <a href="{% url 'admin_dashboard' %}" 
                       class="block w-full py-4 bg-transparent border border-white/10 text-white/60 font-bold text-[10px] uppercase tracking-[0.2em] rounded-lg hover:bg-white/5 hover:text-white transition-all">
                        Back to Dashboard
                    </a>
                </form>
            </div>
        </div>

        <p class="text-center text-white/20 text-[10px] mt-8 uppercase tracking-widest">
            &copy; 2026 Scentora Luxury Fragrances
        </p>
    </div>

</body>
</html>
