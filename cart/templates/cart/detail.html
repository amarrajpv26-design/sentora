{% extends 'users/index.html' %}
{% load static %}

{% block content %}
<div class="bg-[#0f0f0f] min-h-screen text-slate-200 selection:bg-primary selection:text-black pt-32 pb-40">

        <main class="max-w-[1440px] mx-auto px-8 lg:px-12">
        
        <div class="flex items-end justify-between mb-16 border-b border-white/5 pb-12">
            <div class="space-y-4">
                <h1 class="text-5xl lg:text-7xl font-extralight uppercase tracking-tighter text-white">
                    Your <span class="text-primary font-black italic">Collection</span>
                </h1>
                
                <p class="text-[10px] uppercase tracking-[0.5em] text-slate-600">Items reserved for your olfactory journey</p>
            </div>
            <a href="{% url 'shop:product_list' %}" class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400 hover:text-primary transition-all pb-2">
                Back to Gallery
            </a>
        </div>
<div id="message-container"></div>
        <div id="cart-wrapper">
    {% include 'cart/partials/cart_content.html' %}
</div>
    </main>
</div>

<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<script>
    document.body.addEventListener('htmx:configRequest', (event) => {
        // This grabs the CSRF token from the cookie/template and attaches it to HTMX
        event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
    });
document.body.addEventListener("htmx:configRequest", (event) => {
    event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
});

document.body.addEventListener("htmx:afterRequest", function(evt) {
    const triggerHeader = evt.detail.xhr.getResponseHeader("HX-Trigger");
    if (!triggerHeader) return;

    const container = document.getElementById("message-container");

    container.innerHTML = `
        <div id="toast-message" class="fixed top-8 left-1/2 -translate-x-1/2 z-[999] bg-black/80 backdrop-blur-2xl border border-white/10 rounded-2xl px-8 py-5 shadow-[0_0_50px_rgba(0,0,0,0.5)] flex items-center gap-4 transition-all duration-500 opacity-0 translate-y-[-10px]">
            <div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
            <div>
                <p class="text-[9px] font-black uppercase tracking-[0.3em] text-primary/60">Scentora Notification</p>
                <p class="text-xs text-white font-light uppercase tracking-widest">${triggerHeader}</p>
            </div>
        </div>
    `;

    const toast = document.getElementById("toast-message");

    // fade in
    setTimeout(() => {
        toast.classList.remove("opacity-0", "translate-y-[-10px]");
    }, 50);

    // auto hide
    setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-[-10px]");

        setTimeout(() => {
            container.innerHTML = "";
        }, 400);
    }, 2500);
});
</script>
{% endblock %}
