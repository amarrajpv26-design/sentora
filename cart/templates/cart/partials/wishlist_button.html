<div id="heart-container-detail-{{ product.id }}">
<button
    type="button"
    hx-post="{% url 'cart:wishlist_toggle' variant.id %}"
    hx-target="#heart-container-detail-{{ product.id }}"
    hx-swap="outerHTML"
    class="group relative"
>

    <!-- subtle hover lift layer (no visual noise) -->
    <div class="absolute inset-0 rounded-full opacity-0 group-hover:opacity-100 transition-all duration-300
        {% if is_in_wishlist %}
            bg-primary/10
        {% else %}
            bg-white/5
        {% endif %}
    "></div>

    <div class="relative w-11 h-11 rounded-full flex items-center justify-center
        backdrop-blur-xl border transition-all duration-300

        {% if is_in_wishlist %}
            bg-primary border-primary
            shadow-[0_8px_25px_rgba(212,175,55,0.18)]
        {% else %}
            bg-black/25 border-white/10
        {% endif %}

        group-hover:border-primary/40
        group-hover:scale-105
        active:scale-95
    ">

        {% if is_in_wishlist %}
            <span class="material-symbols-outlined text-black text-[20px]">
                favorite
            </span>
        {% else %}
            <span class="material-symbols-outlined text-white group-hover:text-primary text-[20px] transition-colors duration-300">
                favorite
            </span>
        {% endif %}

    </div>

</button>
</div>
