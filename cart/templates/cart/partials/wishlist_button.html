<div id="heart-container-detail-{{ product.id }}">
<button
    type="button"
    hx-post="{% url 'cart:wishlist_toggle' variant.id %}"
    hx-target="#heart-container-detail-{{ product.id }}"
    hx-swap="outerHTML"
    class="group"
>

    <div class="w-11 h-11 rounded-full flex items-center justify-center
        backdrop-blur-xl border transition-all duration-500

        {% if is_in_wishlist %}
            bg-primary border-primary
            shadow-[0_0_20px_rgba(212,175,55,0.35)]
            hover:scale-110
        {% else %}
            bg-black/30 border-white/10
            hover:border-primary/40
            hover:bg-black/50
            hover:scale-110
        {% endif %}
    ">

        {% if is_in_wishlist %}
            <span class="material-symbols-outlined text-black text-[20px]">
                favorite
            </span>
        {% else %}
            <span class="material-symbols-outlined text-white group-hover:text-primary text-[20px] transition-colors duration-500">
                favorite
            </span>
        {% endif %}

    </div>

</button>
</div>
