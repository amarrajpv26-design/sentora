<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scentora | Transmission Sent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050505] min-h-screen flex items-center justify-center p-6 text-white font-sans">
    <div class="w-full max-w-[500px] bg-[#0a0a0a] border border-white/5 p-12 text-center rounded-3xl">
        <div class="text-[#F4B41A] text-4xl mb-6">✉</div>
        <h2 class="text-xl font-light tracking-[0.3em] uppercase mb-4">Link Dispatched</h2>
        <p class="text-[11px] text-gray-500 uppercase tracking-widest leading-loose">
            Check your inbox. If an account is associated with that email, access instructions have been sent.
        </p>
        <a href="{% url 'user_login' %}" class="inline-block mt-10 text-[9px] border-b border-[#F4B41A] text-[#F4B41A] uppercase tracking-[0.4em] pb-1">
            Back to Gateway
        </a>
    </div>
</body>
</html>
