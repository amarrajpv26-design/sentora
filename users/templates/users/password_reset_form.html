<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Scentora | Restore Access</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700&display=swap"
              rel="stylesheet">
        <style>
        body { font-family: 'Manrope', sans-serif; background-color: #050505; color: white; }
        .gold-glow { box-shadow: 0 0 50px -10px rgba(244, 180, 26, 0.1); }
        </style>
    </head>
    <body class="min-h-screen flex items-center justify-center p-6">
        <div class="fixed top-0 left-0 w-full h-full pointer-events-none">
            <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
        </div>
        <div class="z-10 w-full max-w-[500px] bg-[#0a0a0a] border border-white/5 p-12 lg:p-16 rounded-3xl gold-glow">
            <div class="text-center mb-12">
                <h1 class="text-2xl font-light tracking-[0.8em] uppercase text-white mb-4">SCENTORA</h1>
                <div class="h-[1px] w-12 bg-[#F4B41A] mx-auto mb-6"></div>
                <p class="text-[10px] uppercase tracking-[0.4em] text-gray-500">Identity Verification</p>
            </div>
            <form method="POST" class="space-y-10">
                {% csrf_token %}
                {% if form.non_field_errors %}
                    <div class="bg-red-500/10 border border-red-500/20 p-4 rounded-xl">
                        {% for error in form.non_field_errors %}
                            <p class="text-red-500 text-[10px] uppercase tracking-widest text-center">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
                <div class="space-y-2">
                    <label class="text-[9px] uppercase tracking-[0.3em] text-gray-400">Registered Email</label>
                    <input type="email"
                           name="email"
                           required
                           class="w-full bg-transparent border-b border-white/10 py-3 outline-none focus:border-[#F4B41A] transition-colors text-sm placeholder:text-white/5"
                           placeholder="vault@scentora.com">
                    {% if form.email.errors %}
                        {% for error in form.email.errors %}
                            <p class="text-red-500 text-[9px] mt-2 uppercase tracking-widest">{{ error }}</p>
                        {% endfor %}
                    {% endif %}
                </div>
                <button type="submit"
                        class="w-full bg-[#F4B41A] text-black text-[10px] font-bold uppercase tracking-[0.4em] py-5 rounded-xl hover:bg-white transition-all duration-500">
                    Send Reset Link
                </button>
            </form>
            <div class="mt-10 text-center">
                <a href="{% url 'user_login' %}"
                   class="text-[9px] uppercase tracking-widest text-gray-600 hover:text-[#F4B41A] transition-colors">
                    Return to Login
                </a>
            </div>
        </div>
    </body>
</html>
