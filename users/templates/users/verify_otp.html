{% load static %}
<!DOCTYPE html>
<html class="dark" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Scentora | Security Access</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;800&display=swap"
              rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
              rel="stylesheet" />
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#F4B41A',
                        'bg-dark': '#050505',
                        'vault-card': '#0A0A0A',
                    }
                }
            }
        }
        </script>
        <style>
        .otp-input:focus { border-color: #F4B41A; box-shadow: 0 0 15px rgba(244, 180, 26, 0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        </style>
    </head>
    <body class="bg-bg-dark font-['Manrope'] text-white antialiased">
        <div class="relative min-h-screen flex items-center justify-center overflow-hidden px-4">
            <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-gold/5 blur-[120px] rounded-full"></div>
            <div class="max-w-md w-full bg-vault-card border border-white/10 rounded-[2.5rem] p-10 shadow-2xl relative z-10">
                <div class="text-center mb-10">
                    <div class="inline-flex items-center justify-center size-12 rounded-full bg-gold/10 text-gold mb-6">
                        <span class="material-symbols-outlined text-3xl">shield_person</span>
                    </div>
                    <h1 class="text-3xl font-black tracking-tight mb-2">Security Access</h1>
                    <p class="text-gray-500 text-xs uppercase tracking-[3px]">Verify your identity</p>
                </div>
                {% if messages %}
                    {% for message in messages %}
                        <div class="bg-red-500/10 border border-red-500/50 text-red-500 text-xs p-3 rounded-lg mb-6 text-center">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                <form method="POST" action="{% url 'verify_otp' %}" id="otp-form">
                    {% csrf_token %}
                    <input type="hidden" name="otp" id="combined-otp">
                    <div class="flex justify-between gap-2 mb-10" id="otp-inputs">
                        <input autofocus
                               class="otp-input w-12 h-16 bg-white/[0.03] border border-white/10 rounded-xl text-center text-2xl font-bold focus:outline-none transition-all"
                               maxlength="1"
                               type="number">
                        <input class="otp-input w-12 h-16 bg-white/[0.03] border border-white/10 rounded-xl text-center text-2xl font-bold focus:outline-none transition-all"
                               maxlength="1"
                               type="number">
                        <input class="otp-input w-12 h-16 bg-white/[0.03] border border-white/10 rounded-xl text-center text-2xl font-bold focus:outline-none transition-all"
                               maxlength="1"
                               type="number">
                        <input class="otp-input w-12 h-16 bg-white/[0.03] border border-white/10 rounded-xl text-center text-2xl font-bold focus:outline-none transition-all"
                               maxlength="1"
                               type="number">
                        <input class="otp-input w-12 h-16 bg-white/[0.03] border border-white/10 rounded-xl text-center text-2xl font-bold focus:outline-none transition-all"
                               maxlength="1"
                               type="number">
                        <input class="otp-input w-12 h-16 bg-white/[0.03] border border-white/10 rounded-xl text-center text-2xl font-bold focus:outline-none transition-all"
                               maxlength="1"
                               type="number">
                    </div>
                    <div class="flex flex-col items-center gap-6">
                        <button type="submit"
                                class="w-full h-14 bg-gold text-black font-black uppercase tracking-[3px] text-[10px] rounded-xl hover:bg-[#e2a616] transition-all transform active:scale-95 shadow-[0_10px_40px_rgba(244,180,26,0.15)]">
                            Verify & Authenticate
                        </button>
                        <div class="text-center">
                            <p class="text-xs text-gray-500 uppercase tracking-widest mb-3"
                               id="resend-text">
                                Resend code in <span class="text-white font-bold" id="timer-span">60s</span>
                            </p>
                            <a href="{% url 'resend_otp' %}"
                               id="resend-btn"
                               class="hidden text-gold text-xs font-bold uppercase tracking-widest hover:underline cursor-pointer">
                                Resend New OTP
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <script>
document.addEventListener('DOMContentLoaded', () => {
    const inputs = document.querySelectorAll('.otp-input');
    const form = document.getElementById('otp-form');
    const combinedInput = document.getElementById('combined-otp');
    const timerSpan = document.getElementById('timer-span');
    const resendBtn = document.getElementById('resend-btn');
    const resendText = document.getElementById('resend-text');

    // OTP Input Logic
    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            if (e.target.value && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && index > 0) {
                inputs[index - 1].focus();
            }
        });

        // NEW: Paste handling — works no matter which box the user pastes into
        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData).getData('text');
            const digits = pasted.replace(/\D/g, '').slice(0, inputs.length);
            if (!digits) return;

            digits.split('').forEach((digit, i) => {
                if (inputs[i]) inputs[i].value = digit;
            });

            // Focus the next empty box, or the last one if all filled
            const nextIndex = digits.length < inputs.length ? digits.length : inputs.length - 1;
            inputs[nextIndex].focus();
        });
    });

    // Combine inputs on submit
    form.addEventListener('submit', (e) => {
        let otpValue = "";
        inputs.forEach(input => otpValue += input.value);
        combinedInput.value = otpValue;
    });

    // Timer Logic
    let timeLeft = 60;
    const countdown = setInterval(() => {
        timeLeft--;
        timerSpan.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
            clearInterval(countdown);
            resendText.classList.add('hidden');
            resendBtn.classList.remove('hidden');
        }
    }, 1000);
});
</script>
    </body>
</html>
