{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-[#050505] px-4">
    <div class="max-w-md w-full bg-white/[0.03] border border-white/10 backdrop-blur-xl rounded-3xl p-10 shadow-2xl">
        
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-white tracking-tight mb-2">Verify Your Account</h2>
            <p class="text-gray-400 text-sm">We've sent a 6-digit code to <br><span class="text-gold font-medium">{{ email }}</span></p>
        </div>

        <form action="{% url 'verify_otp' %}" method="POST" class="space-y-8">
            {% csrf_token %}
            
            <div class="flex justify-center">
                <input type="text" name="otp" maxlength="6" placeholder="000000"
                       class="w-full bg-black/40 border border-white/10 rounded-xl py-4 text-center text-3xl tracking-[15px] font-bold text-gold focus:border-gold/50 focus:outline-none transition-all placeholder:text-white/5"
                       required autocomplete="off">
            </div>

            <button type="submit" 
                    class="w-full py-4 bg-gold text-black font-bold uppercase tracking-[2px] text-xs rounded-xl hover:bg-[#e2a616] hover:shadow-[0_0_30px_rgba(244,180,26,0.3)] transition-all transform hover:-translate-y-0.5">
                Verify Identity
            </button>
        </form>

        <div class="mt-10 text-center">
            <div id="timer-container" class="text-sm text-gray-500 mb-4">
                Code expires in: <span id="timer" class="text-white font-mono font-bold">02:00</span>
            </div>
            
            <a href="{% url 'resend_otp' %}" id="resend-btn" 
               class="text-[11px] font-bold uppercase tracking-widest text-gray-600 pointer-events-none transition-colors duration-500">
                Resend New Code
            </a>
        </div>

    </div>
</div>

<script>
    let timeLeft = 120; // 2 minutes in seconds
    const timerDisplay = document.getElementById('timer');
    const resendBtn = document.getElementById('resend-btn');

    const countdown = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        seconds = seconds < 10 ? '0' + seconds : seconds;

        timerDisplay.innerHTML = `0${minutes}:${seconds}`;

        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerDisplay.innerHTML = "00:00";
            document.getElementById('timer-container').classList.add('opacity-30');
            
            // Activate Resend Button with Gold Style
            resendBtn.classList.remove('text-gray-600', 'pointer-events-none');
            resendBtn.classList.add('text-gold', 'hover:text-white');
        } else {
            timeLeft--;
        }
    }, 1000);
</script>
{% endblock %}
