{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong | Scentora</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #0a0a0a;
            background-image:
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(236, 182, 19, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 90% 10%, rgba(255, 255, 255, 0.04), transparent);
            color: #f0ece4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .wrap { text-align: center; max-width: 520px; }
        .eyebrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 40px;
        }
        .eyebrow-line { height: 1px; width: 40px; background: linear-gradient(90deg, transparent, #D4AF37); }
        .eyebrow-line.right { background: linear-gradient(90deg, #D4AF37, transparent); }
        .eyebrow p {
            color: #D4AF37;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.45em;
            text-transform: uppercase;
        }
        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 300;
            font-size: clamp(80px, 16vw, 130px);
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 1px rgba(212, 175, 55, 0.5);
            margin-bottom: 8px;
        }
        .divider {
            width: 1px;
            height: 48px;
            margin: 16px auto;
            background: linear-gradient(to bottom, #D4AF37, transparent);
        }
        h2 {
            font-family: 'Fraunces', serif;
            font-size: clamp(22px, 4vw, 30px);
            font-weight: 300;
            color: #f0ece4;
            font-style: italic;
            margin-bottom: 16px;
        }
        h2 span { font-style: normal; font-weight: 600; color: #fff; }
        p.msg {
            font-size: 12px;
            font-weight: 300;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.06em;
            line-height: 1.8;
            max-width: 340px;
            margin: 0 auto 40px;
        }
        .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            padding: 14px 32px;
            border-radius: 1px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary { background: #D4AF37; color: #0a0a0a; }
        .btn-ghost {
            background: transparent;
            color: rgba(255,255,255,0.6);
            border: 0.5px solid rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="eyebrow">
            <span class="eyebrow-line"></span>
            <p>Error 500</p>
            <span class="eyebrow-line right"></span>
        </div>

        <h1>500</h1>

        <div class="divider"></div>

        <h2>A Momentary <span>Disturbance</span></h2>

        <p class="msg">
            Something went wrong on our end.<br>
            Our artisans have been notified and are already at work.
        </p>

        <div class="btns">
<a href="{{ return_url }}" class="btn btn-primary">{{ return_label }}</a>        </div>
    </div>
</body>
</html>
