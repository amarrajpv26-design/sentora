<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scentora Vault Recovery</title>
</head>
<body style="margin: 0; padding: 0; background-color: #050505; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #ffffff;">
    <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #050505; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="100%" max-width="500" border="0" cellspacing="0" cellpadding="0" style="max-width: 500px; background-color: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 24px; padding: 40px;">
                    
                    <tr>
                        <td align="center" style="padding-bottom: 20px;">
                            <h1 style="margin: 0; font-size: 24px; letter-spacing: 8px; text-transform: uppercase; font-weight: 900; color: #ffffff;">SCENTORA</h1>
                            <div style="height: 1px; width: 40px; background-color: #F4B41A; margin: 15px auto;"></div>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding-bottom: 30px;">
                            <p style="margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 3px; color: #666666;">Access Restoration</p>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding: 10px 0;">
                            <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #999999; max-width: 300px; margin-bottom: 30px;">
                                A password reset was requested for your vault. Please use the secure link below to update your credentials.
                            </p>
                            <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" 
                               style="display: inline-block; background-color: #F4B41A; color: #050505; padding: 18px 40px; border-radius: 12px; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: 3px; text-decoration: none;">
                                Reset Password
                            </a>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="border-top: 1px solid #1a1a1a; padding-top: 25px; margin-top: 30px;">
                            <p style="margin: 0; font-size: 9px; color: #444444; text-transform: uppercase; letter-spacing: 2px;">
                                For your security, this link is only valid for a limited time.
                            </p>
                        </td>
                    </tr>

                </table>
                
                <table width="100%" max-width="500" border="0" cellspacing="0" cellpadding="0" style="max-width: 500px; padding-top: 20px;">
                    <tr>
                        <td align="center">
                            <p style="font-size: 10px; color: #333333; margin: 0;">&copy; 2026 Scentora Luxury Interiors. All rights reserved.</p>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>
</body>
</html>
