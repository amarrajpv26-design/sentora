server {
    server_name 3.110.187.92 scentora.ddns.net;
    client_max_body_size 5M;
    location = /favicon.ico { access_log off; log_not_found off; }
    location /static/ {
        alias /home/ubuntu/sentora/staticfiles/;
    }
    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/sentora/gunicorn.sock;
    }
}
